on:
  workflow_call:
    inputs:
      max-loc:
        description: >
          The maximum number of code lines one code file may hold. A code
          file is one R collates: .R, .r, .S, .s or .q, in R/, R/unix/ or
          R/windows/.
        type: number
        default: 1000
      loc-allowlist:
        description: >
          Repo-relative paths the limit does not apply to, one per line.
          Every entry MUST name a code file the gate checks, so one in R/,
          R/unix/ or R/windows/.
        type: string
        default: ""
      max-cyclocomp:
        description: >
          The maximum cyclomatic complexity one function may hold. 15 is
          lintr's own default.
        type: number
        default: 15
      lint-allowlist:
        description: >
          Lints this gate does not apply, one per line. Write each one as
          <repo-relative path>:<linter name>, for example R/plan.R:seq_linter.
          Every entry MUST name a code file the gate checks, and MUST suppress
          at least one lint, so an entry cannot outlive its reason.
        type: string
        default: ""
      lintr-version:
        description: >
          The exact lintr version the gate installs. A lintr release changes
          what the linters flag, so the gate pins it and asserts it.
        type: string
        default: "3.4.0"
      cyclocomp-version:
        description: The exact cyclocomp version the gate installs.
        type: string
        default: "1.1.2"
      extra-packages:
        description: Extra packages for setup-r-dependencies to install before R CMD check.
        type: string
        default: any::rcmdcheck
      cran:
        description: >
          The CRAN mirror to build against. The empty default leaves the
          repository that setup-r picks.
        type: string
        default: ""
      use-public-rspm:
        description: >
          Use the public Posit package manager. It takes precedence over cran,
          so a non-empty cran turns it off.
        type: boolean
        default: true

name: R package

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Both paths sit beside the checkout, never inside it. The runner
      # context is not available in a job-level env, so these use
      # github.workspace. With runner.temp here GitHub rejects the whole
      # workflow: the run fails before any job starts and reports no job at
      # all, which reads like a broken gate rather than a syntax error.
      #
      # One library for both gates. Two libraries could load two different
      # trees, and then the two checks would not describe the same package.
      GATE_LIB: ${{ github.workspace }}/../static-checks-library
      # The one file list. Both gates read this file, so the code-line limit
      # and the linter cannot check different files.
      CODE_FILES: ${{ github.workspace }}/../code-files.txt

    steps:
      - uses: actions/checkout@v4

      # Pinned, not release. This gate must not change its answer because R
      # released a new version.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      # org is pinned by full commit SHA. lintr and cyclocomp are pinned by
      # version, and the versions are asserted below. A branch reference or a
      # floating version would let one upstream release change every caller's
      # gate, with no diff in any caller.
      - name: Install the gate packages
        env:
          LINTR_VERSION: ${{ inputs.lintr-version }}
          CYCLOCOMP_VERSION: ${{ inputs.cyclocomp-version }}
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("GATE_LIB")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          install.packages(
            "pak",
            lib = lib,
            repos = sprintf(
              "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
              .Platform$pkgType,
              R.version$os,
              R.version$arch
            )
          )
          .libPaths(c(lib, .libPaths()))
          pak::pak(
            c(
              "raubreywhite/org@33f76369f6eceb9fcb1eb7734500e52450e27384",
              "lintr",
              "cyclocomp"
            ),
            lib = lib,
            ask = FALSE
          )

          # pak accepts pkg@version for a CRAN package and then installs the
          # repository's current version anyway, with no error and no warning.
          # Measured on pak 0.9.0: pkg_deps("cran::lintr@99.0.0") returned
          # 3.3.0-1. So step the version here, and assert it below. Never
          # trust the ref syntax alone.
          want <- c(
            lintr = Sys.getenv("LINTR_VERSION"),
            cyclocomp = Sys.getenv("CYCLOCOMP_VERSION")
          )
          for (p in names(want)) {
            got <- as.character(utils::packageVersion(p, lib.loc = lib))
            if (!identical(got, want[[p]])) {
              remotes::install_version(
                p,
                version = want[[p]],
                lib = lib,
                dependencies = FALSE,
                upgrade = "never"
              )
            }
          }

          got <- vapply(
            names(want),
            function(p) as.character(utils::packageVersion(p, lib.loc = lib)),
            character(1)
          )
          if (!identical(unname(got), unname(want))) {
            stop(
              "The gate needs these versions:\n",
              paste0("  ", names(want), " ", want, collapse = "\n"),
              "\nIt installed these:\n",
              paste0("  ", names(got), " ", got, collapse = "\n"),
              "\nRe-measure the package, then change lintr-version or",
              " cyclocomp-version.",
              call. = FALSE
            )
          }
          cat(
            "Gate packages: ",
            paste0(names(got), " ", got, collapse = ", "), "\n",
            sep = ""
          )

      # This step is the one selection rule. Both gates below read the list it
      # writes. A second listing somewhere else is how one gate comes to check
      # a file the other does not.
      - name: Select the package code files
        shell: Rscript {0}
        run: |

          # R collates every file in R/ whose extension is in
          # tools:::.make_file_exts("code"). Sys.glob("R/*.R") saw one of the
          # five, so a file named `.r` was invisible to this gate.
          code_exts <- c("R", "r", "S", "s", "q")

          # Fail loudly if a future R adds a sixth, rather than check fewer
          # files than R loads.
          if (exists(".make_file_exts", envir = asNamespace("tools"), inherits = FALSE)) {
            r_exts <- tools:::.make_file_exts("code")
            if (!setequal(r_exts, code_exts)) {
              stop(
                "R collates these code extensions: ", paste(r_exts, collapse = " "),
                "\nThis gate checks: ", paste(code_exts, collapse = " "),
                "\nUpdate code_exts in the workflow.",
                call. = FALSE
              )
            }
          }

          # grep() over the listing, never a glob. Sys.glob() hands the match
          # to the OS. A case-insensitive filesystem then matches foo.r
          # against "R/*.R", so a union of five globs counts one file five
          # times. list.files() returns each entry once and grep() decides in
          # R, case-sensitively. This mirrors tools::list_files_with_exts().
          pattern <- paste0("\\.(", paste(code_exts, collapse = "|"), ")$")

          # R also collates an OS subdirectory of R/, so a file there is
          # package code that no listing of R/ alone can see.
          #
          # Check both, not the runner's OS alone. R CMD INSTALL collates the
          # runner's subdirectory only, but R CMD check reads both on either
          # platform: tools:::.check_package_code_syntax() passes
          # OS_subdirs = c("unix", "windows"). Every job here runs on
          # ubuntu-latest, so a runner-OS gate never looks in R/windows/. It
          # also rejects a loc-allowlist entry for a file there, calling it
          # stale, which leaves that file no way to be exempted.
          #
          # R collates these three directories and no others. R/helpers/ is
          # not package code, so this loop must not recurse. list.files()
          # returns nothing for a directory that does not exist, so a package
          # without R/unix/ needs no guard here.
          files <- character()
          for (d in c("R", "R/unix", "R/windows")) {
            found <- list.files(d, all.files = FALSE)
            files <- c(files, file.path(d, grep(pattern, found, value = TRUE)))
          }
          files <- sort(files)

          # A selection that matches nothing must fail, not pass as compliance.
          if (length(files) == 0) {
            stop(
              "Found no code file in R/ with an extension R collates (",
              paste0(".", code_exts, collapse = ", "),
              "), so the limit checked nothing.",
              call. = FALSE
            )
          }
          writeLines(files, Sys.getenv("CODE_FILES"))
          cat("Selected ", length(files), " code files.\n", sep = "")

      # org::loc_per_file() is the single implementation of the count. Do not
      # reimplement it here.
      - name: Check the code lines in every code file
        env:
          MAX_LOC: ${{ inputs.max-loc }}
          LOC_ALLOWLIST: ${{ inputs.loc-allowlist }}
        shell: Rscript {0}
        run: |
          .libPaths(c(Sys.getenv("GATE_LIB"), .libPaths()))
          files <- readLines(Sys.getenv("CODE_FILES"))

          # An empty list would pass as compliance. The selection step already
          # stops on it, so reaching here empty means the list did not survive
          # to this step.
          if (length(files) == 0) {
            stop("The code file list is empty, so this gate checked nothing.", call. = FALSE)
          }
          max_loc <- suppressWarnings(as.numeric(Sys.getenv("MAX_LOC")))
          if (is.na(max_loc)) {
            stop(
              "max-loc must be one number. It arrived as: ",
              Sys.getenv("MAX_LOC"),
              call. = FALSE
            )
          }

          allowlist <- strsplit(Sys.getenv("LOC_ALLOWLIST"), "\n", fixed = TRUE)[[1]]
          allowlist <- trimws(allowlist)
          allowlist <- allowlist[nzchar(allowlist)]

          # A stale entry that silently does nothing is how an allowlist
          # outlives its reason.
          stale <- setdiff(allowlist, files)
          if (length(stale) > 0) {
            stop(
              "These loc-allowlist entries name no file in R/:\n",
              paste0("  ", stale, collapse = "\n"),
              "\nRemove them from loc-allowlist.",
              call. = FALSE
            )
          }

          counts <- org::loc_per_file(files)
          over <- counts[counts > max_loc & !names(counts) %in% allowlist]
          if (length(over) > 0) {
            stop(
              "These files hold more than ", max_loc, " code lines:\n",
              paste0("  ", names(over), " (", over, ")", collapse = "\n"),
              "\nSplit them, or add them to loc-allowlist.",
              call. = FALSE
            )
          }

          cat(
            "Checked ", length(files), " files against a limit of ", max_loc,
            ". The maximum is ", max(counts), ".\n",
            sep = ""
          )

      # Runs even when the code-line limit failed, so one push reports both.
      # Otherwise you fix the length, push, and only then meet the lints.
      - name: Lint every code file
        if: ${{ !cancelled() }}
        env:
          MAX_CYCLOCOMP: ${{ inputs.max-cyclocomp }}
          LINT_ALLOWLIST: ${{ inputs.lint-allowlist }}
        shell: Rscript {0}
        run: |
          .libPaths(c(Sys.getenv("GATE_LIB"), .libPaths()))
          files <- readLines(Sys.getenv("CODE_FILES"))
          if (length(files) == 0) {
            stop("The code file list is empty, so this gate checked nothing.", call. = FALSE)
          }

          max_cyclocomp <- suppressWarnings(as.integer(Sys.getenv("MAX_CYCLOCOMP")))
          if (is.na(max_cyclocomp)) {
            stop(
              "max-cyclocomp must be one whole number. It arrived as: ",
              Sys.getenv("MAX_CYCLOCOMP"),
              call. = FALSE
            )
          }

          # lintr drops cyclocomp_linter() when cyclocomp is absent. The gate
          # would then check one thing less and still report success.
          if (!requireNamespace("cyclocomp", quietly = TRUE)) {
            stop(
              "cyclocomp is not installed, so cyclocomp_linter() would check nothing.",
              call. = FALSE
            )
          }

          # An explicit list, never lintr::default_linters. A lintr release
          # adds new default linters, so a defaults-based gate turns red on a
          # package that did not change. That is why r-version is pinned too.
          linters <- list(
            cyclocomp_linter = lintr::cyclocomp_linter(max_cyclocomp),
            seq_linter = lintr::seq_linter(),
            vector_logic_linter = lintr::vector_logic_linter(),
            T_and_F_symbol_linter = lintr::T_and_F_symbol_linter(),
            condition_call_linter = lintr::condition_call_linter(),
            # The house style is an explicit return(). org is written that way
            # and most of the fleet is not, so this linter is what makes them
            # agree.
            return_linter = lintr::return_linter(return_style = "explicit"),
            # The house rules that no other tool checks.
            undesirable_function_linter = lintr::undesirable_function_linter(
              fun = c(
                sapply = "use vapply(), which pins the return type",
                setwd = "use the paths org::project gives you",
                attach = "never; it hides where a name came from",
                saveRDS = "use qs2::qs_save()",
                readRDS = "use qs2::qs_read()"
              )
            )
          )

          # parse_settings = FALSE, so a .lintr file inside a package cannot
          # weaken the shared gate. Exemptions go through lint-allowlist, which
          # this step checks for staleness.
          found <- do.call(rbind, lapply(files, function(f) {
            l <- lintr::lint(f, linters = linters, parse_settings = FALSE)
            if (length(l) == 0) {
              return(NULL)
            }
            # Carry the path from the selection list, not lintr's own
            # filename. lintr returns an absolute path, and lint-allowlist
            # entries are repo-relative, so matching on lintr's path would
            # make every allowlist entry look unused.
            data.frame(
              file = f,
              line = vapply(l, function(x) x$line_number, integer(1)),
              linter = vapply(l, function(x) x$linter, character(1)),
              message = vapply(l, function(x) x$message, character(1)),
              stringsAsFactors = FALSE
            )
          }))
          if (is.null(found)) {
            found <- data.frame(
              file = character(),
              line = integer(),
              linter = character(),
              message = character(),
              stringsAsFactors = FALSE
            )
          }

          allowlist <- strsplit(Sys.getenv("LINT_ALLOWLIST"), "\n", fixed = TRUE)[[1]]
          allowlist <- trimws(allowlist)
          allowlist <- allowlist[nzchar(allowlist)]

          malformed <- allowlist[!grepl("^[^:]+:[A-Za-z0-9._]+$", allowlist)]
          if (length(malformed) > 0) {
            stop(
              "These lint-allowlist entries are not <path>:<linter>:\n",
              paste0("  ", malformed, collapse = "\n"),
              call. = FALSE
            )
          }

          # Two staleness checks, because an entry can go stale two ways. The
          # file can disappear, and the lint can be fixed while the entry stays.
          entry_file <- sub(":[^:]*$", "", allowlist)
          stale_file <- allowlist[!entry_file %in% files]
          if (length(stale_file) > 0) {
            stop(
              "These lint-allowlist entries name no file this gate checks:\n",
              paste0("  ", stale_file, collapse = "\n"),
              "\nRemove them from lint-allowlist.",
              call. = FALSE
            )
          }

          key <- paste0(found$file, ":", found$linter)
          unused <- setdiff(allowlist, key)
          if (length(unused) > 0) {
            stop(
              "These lint-allowlist entries suppress no lint:\n",
              paste0("  ", unused, collapse = "\n"),
              "\nRemove them from lint-allowlist.",
              call. = FALSE
            )
          }

          over <- found[!key %in% allowlist, , drop = FALSE]
          if (nrow(over) > 0) {
            stop(
              "These lints must be fixed:\n",
              paste0(
                "  ", over$file, ":", over$line, "  ",
                over$linter, "  ", over$message,
                collapse = "\n"
              ),
              "\nFix them, or add <path>:<linter> to lint-allowlist.",
              call. = FALSE
            )
          }

          cat(
            "Linted ", length(files), " files with ", length(linters),
            " linters. No findings.\n",
            sep = ""
          )

  R-CMD-check:
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Without this, testthat's skip_on_cran() skips in CI as if the run were
      # on CRAN, and every opt-in test a package gates behind it never runs.
      # batchit's seam tests are the measured case.
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      # Two mutually exclusive steps, because a with: key cannot be omitted by
      # an expression. The empty cran default leaves setup-r alone.
      - uses: r-lib/actions/setup-r@v2
        if: inputs.cran == ''
        with:
          r-version: release
          use-public-rspm: ${{ inputs.use-public-rspm }}

      - uses: r-lib/actions/setup-r@v2
        if: inputs.cran != ''
        with:
          r-version: release
          use-public-rspm: false
          cran: ${{ inputs.cran }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ inputs.extra-packages }}
          needs: check

      # error-on defaults to "warning", which is how two packages shipped their
      # .github directory for as long as it existed: the note was reported on
      # every run and nothing ever failed, so nobody read it.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'

  pkgdown:
    needs: [static-checks, R-CMD-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        if: inputs.cran == ''
        with:
          r-version: release
          use-public-rspm: ${{ inputs.use-public-rspm }}

      - uses: r-lib/actions/setup-r@v2
        if: inputs.cran != ''
        with:
          r-version: release
          use-public-rspm: false
          cran: ${{ inputs.cran }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::devtools
          needs: website

      - name: Install package
        run: devtools::install()
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages()
        shell: Rscript {0}

      # pkgdown:::package_mds() globs every root *.md and excludes only a fixed
      # list (README, LICENSE, NEWS, cran-comments, the issue templates). There
      # is no setting for it, so CLAUDE.md renders to docs/CLAUDE.html.
      #
      # pkgdown then writes that page text into two more files.
      # build_llm_docs() converts every *.html under docs/ to a *.md beside it,
      # which is where docs/CLAUDE.md comes from. build_search() writes the
      # text of every page into docs/search.json. The deploy step ships the
      # whole docs/ directory, so all three files must go.
      #
      # Under `set -e`, a pipeline that starts with `!` never aborts the script.
      # So a `! grep` assertion is inert unless it is the step's last command.
      # Every assertion below uses `if ...; then exit 1; fi` instead, which is
      # live wherever it sits.
      - name: Keep agent instructions off the published site
        run: |
          set -euo pipefail

          # Fail if pkgdown stopped generating the page, so this step cannot
          # pass silently once it is no longer doing anything.
          if [ ! -f docs/CLAUDE.html ]; then
            echo "docs/CLAUDE.html is absent. pkgdown stopped generating it, so this"
            echo "step is no longer doing what it was added for. Check whether the"
            echo "other four names below are still the right ones."
            exit 1
          fi
          # Only one caller publishes a PROJECT.md, so PROJECT stays optional.
          rm -f docs/CLAUDE.html docs/CLAUDE.md docs/PROJECT.html docs/PROJECT.md

          sed -i \
            -e '\|<url><loc>[^<]*/CLAUDE\.[^<]*</loc></url>|d' \
            -e '\|<url><loc>[^<]*/PROJECT\.[^<]*</loc></url>|d' \
            docs/sitemap.xml

          # Match on the `path` field, never on the text. A page that survives
          # may name CLAUDE.md for a good reason, and the cs9 changelog does.
          # A site with search turned off has no docs/search.json, which is not
          # an error. Any parse failure exits non-zero, and this is a plain
          # assignment, so `set -e` fails the step. A malformed file cannot
          # pass quietly.
          agent_indexed=$(python3 - <<'PY'
          import json
          import os
          import re
          import sys

          P = "docs/search.json"
          AGENT = re.compile(r"^(CLAUDE|PROJECT)\.")


          def load():
              with open(P) as fh:
                  d = json.load(fh)
              if not isinstance(d, list):
                  sys.exit(P + " is not a JSON array. pkgdown changed its format.")
              return d


          def is_agent(entry):
              if not isinstance(entry, dict):
                  sys.exit(P + " holds a non-object entry. pkgdown changed its format.")
              url = str(entry.get("path") or "").split("?")[0].split("#")[0]
              return bool(AGENT.match(url.rsplit("/", 1)[-1]))


          if os.path.exists(P):
              kept = [e for e in load() if not is_agent(e)]
              with open(P, "w") as fh:
                  json.dump(kept, fh)
              # Re-read from disk, so the check reports on the file that ships.
              for entry in load():
                  if is_agent(entry):
                      print(entry.get("path"))
          PY
          )

          if grep -qE 'CLAUDE\.|PROJECT\.' docs/sitemap.xml; then
            echo "docs/sitemap.xml still lists an agent instructions page:"
            grep -nE 'CLAUDE\.|PROJECT\.' docs/sitemap.xml
            exit 1
          fi

          if [ -n "$agent_indexed" ]; then
            echo "docs/search.json still indexes an agent instructions page:"
            echo "$agent_indexed"
            exit 1
          fi

          # This assertion catches any further extension that pkgdown emits.
          left=$(find docs \( -name 'CLAUDE.*' -o -name 'PROJECT.*' \) -print)
          if [ -n "$left" ]; then
            echo "These agent instruction files survive under docs/:"
            echo "$left"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
